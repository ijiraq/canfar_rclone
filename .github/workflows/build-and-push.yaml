name: Build and Push to CANFAR Registry

on:
  push:
    branches:
      - main  # Triggers the build every time you push to the main branch
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the code from the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Docker Buildx (improves build performance/caching)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Log into the CANFAR Docker Registry
    - name: Log in to CANFAR Registry
      uses: docker/login-action@v3
      with:
        registry: images.canfar.net
        username: ${{ secrets.CANFAR_USERNAME }}
        password: ${{ secrets.CANFAR_PASSWORD }}

    # 4. Build the image and push it directly to CANFAR
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Replace <your_canfar_username_or_project> with your CADC space name
        tags: |
          images.canfar.net/${{ secrets.CANFAR_USERNAME }}/rclone-bridge:latest
          images.canfar.net/${{ secrets.CANFAR_USERNAME }}/rclone-bridge:${{ github.sha }}

